# Builds and tests Metakit on the platforms which matter for datafiles of over
# 2 Gb: Linux (x64, ARM64, 32-bit), macOS (Apple Silicon, Intel) and Windows
# (MSVC: x64, x86, ARM64), and the Tcl and Python (2) bindings.
name: ci

on:
  push:
    branches: [ccr-7001915e-qdjw33, master]
  pull_request:
  workflow_dispatch:

jobs:
  unix:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "linux x64", os: ubuntu-24.04, large: "5 512 --expect-all" }
          - { name: "linux arm64", os: ubuntu-24.04-arm, large: "5 512 --expect-all" }
          - { name: "macos arm64", os: macos-latest, large: "5 512 --expect-all" }
          - { name: "macos x64", os: macos-13, large: "" }
    env:
      LD_LIBRARY_PATH: .
      DYLD_LIBRARY_PATH: .
    steps:
      - uses: actions/checkout@v4
      - name: configure and build
        run: |
          mkdir build && cd build
          ../unix/configure
          make -j4 libmk4.so regress twide tfuzz tcorrupt tlarge mkinfo ||
            make -j4 regress twide tfuzz tcorrupt tlarge mkinfo
      - name: tests
        working-directory: build
        run: make test
      - name: datafile of over 4 Gb
        if: matrix.large != ''
        working-directory: build
        run: |
          df -h .
          ./tlarge tlarge.mk ${{ matrix.large }}
          rm -f tlarge.mk tlarge_ints.mk

  linux-variants:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "linux 32-bit"
            cxxflags: "-O2 -m32"
            ldflags: "-m32"
            packages: "g++-multilib"
            large: "5 512 --expect-all --ints=50"
          - name: "linux without mmap"
            cxxflags: "-O2 -DNO_MMAP=1"
            ldflags: ""
            packages: ""
            large: "5 512 --expect-all --unmapped"
          - name: "linux clang"
            cxxflags: "-O2"
            ldflags: ""
            packages: "clang"
            cxx: clang++
            large: ""
    env:
      LD_LIBRARY_PATH: .
    steps:
      - uses: actions/checkout@v4
      - name: packages
        if: matrix.packages != ''
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.packages }}
      - name: configure and build
        run: |
          mkdir build && cd build
          CXX="${{ matrix.cxx || 'g++' }}" CXXFLAGS="${{ matrix.cxxflags }}" LDFLAGS="${{ matrix.ldflags }}" ../unix/configure
          make -j4 libmk4.so regress twide tfuzz tcorrupt tlarge
      - name: tests
        working-directory: build
        run: make test
      - name: datafile of over 4 Gb
        if: matrix.large != ''
        working-directory: build
        run: ./tlarge tlarge.mk ${{ matrix.large }}

  sanitizers:
    name: linux AddressSanitizer + UBSan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: tests/sanitize.sh . tfuzz
      - name: damaged datafiles
        run: |
          cd sanitize-work
          make -j4 tcorrupt
          LD_LIBRARY_PATH=. ASAN_OPTIONS=detect_leaks=1 TCORRUPT_LONG=1 ./tcorrupt 1 8000

  windows:
    name: windows msvc ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, os: windows-latest, large: "5 512 --expect-all" }
          - { arch: x86, os: windows-latest, large: "5 512 --expect-all --ints=50" }
          - { arch: arm64, os: windows-11-arm, large: "" }
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}
      - name: build and test
        shell: pwsh
        run: tests/ci/msvc.ps1 -Arch ${{ matrix.arch }} -LargeArgs "${{ matrix.large }}"

  tcl:
    name: tcl binding (Mk4tcl)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y tcl-dev tcl
      - name: build and test
        run: |
          mkdir build && cd build
          CC=g++ ../tcl/configure
          make -j4
          make test 2>&1 | tee test.log
          grep -q "Failed	0" test.log

  python:
    name: python 2 binding (Mk4py)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "2.7"
      - name: build and test
        run: python/test/ci.sh
