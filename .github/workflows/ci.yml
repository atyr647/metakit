# Builds and tests Metakit on the platforms which matter for datafiles of over
# 2 Gb: Linux (x64, ARM64, 32-bit) and Windows (MSVC: x64, x86, ARM64), and the
# Tcl and Python (2) bindings.  macOS is in macos.yml.
name: ci

on:
  push:
    branches: [ccr-7001915e-qdjw33, master]
  pull_request:
  workflow_dispatch:

jobs:
  unix:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "linux x64", os: ubuntu-24.04, large: "5 512 --expect-all" }
          - { name: "linux arm64", os: ubuntu-24.04-arm, large: "5 512 --expect-all" }
          # (macOS is in macos.yml, which is started by hand)
    env:
      LD_LIBRARY_PATH: .
      DYLD_LIBRARY_PATH: .
    steps:
      - uses: actions/checkout@v4
      - name: configure and build
        run: |
          mkdir build && cd build
          ../unix/configure
          make -j4 libmk4.so regress twide tfuzz tcorrupt tlarge mkinfo ||
            make -j4 regress twide tfuzz tcorrupt tlarge mkinfo
      - name: tests
        working-directory: build
        run: make test
      - name: datafile of over 4 Gb
        if: matrix.large != ''
        working-directory: build
        run: |
          df -h .
          ./tlarge tlarge.mk ${{ matrix.large }}
          rm -f tlarge.mk tlarge_ints.mk

  linux-variants:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "linux 32-bit"
            # (-m32 goes into the compiler command, so it is also there when
            # the shared library is linked)
            cxx: "g++ -m32"
            cxxflags: "-O2"
            ldflags: ""
            packages: "g++-multilib"
            large: "5 512 --expect-all --ints=50"
          - name: "linux without mmap"
            cxxflags: "-O2 -DNO_MMAP=1"
            ldflags: ""
            packages: ""
            large: "5 512 --expect-all --unmapped"
          - name: "linux clang"
            cxxflags: "-O2"
            ldflags: ""
            packages: "clang"
            cxx: clang++
            large: ""
    env:
      LD_LIBRARY_PATH: .
    steps:
      - uses: actions/checkout@v4
      - name: packages
        if: matrix.packages != ''
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.packages }}
      - name: configure and build
        run: |
          mkdir build && cd build
          CXX="${{ matrix.cxx || 'g++' }}" CXXFLAGS="${{ matrix.cxxflags }}" LDFLAGS="${{ matrix.ldflags }}" ../unix/configure
          # (the shared library is linked with SHLIB_LD, which configure sets to
          # g++ -shared whatever CXX is: the compiler command is used for it)
          make -j4 SHLIB_LD="${{ matrix.cxx || 'g++' }} -shared" libmk4.so regress twide tfuzz tcorrupt tlarge
      - name: tests
        working-directory: build
        run: make SHLIB_LD="${{ matrix.cxx || 'g++' }} -shared" test
      - name: datafile of over 4 Gb
        if: matrix.large != ''
        working-directory: build
        run: ./tlarge tlarge.mk ${{ matrix.large }}

  sanitizers:
    name: linux AddressSanitizer + UBSan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: tests/sanitize.sh . tfuzz
      - name: damaged datafiles
        run: |
          cd sanitize-work
          make -j4 tcorrupt
          LD_LIBRARY_PATH=. ASAN_OPTIONS=detect_leaks=1 TCORRUPT_LONG=1 ./tcorrupt 1 8000

  windows:
    name: windows msvc ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, os: windows-latest, large: "5 512 --expect-all" }
          # (a 32-bit Windows process has 2 Gb of address space: smaller rows)
          - { arch: x86, os: windows-latest, large: "36 128 --expect-all --ints=50" }
          - { arch: arm64, os: windows-11-arm, large: "" }
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}
      - name: build and test
        shell: pwsh
        run: tests/ci/msvc.ps1 -Arch ${{ matrix.arch }} -LargeArgs "${{ matrix.large }}"

  tcl:
    name: tcl binding (Mk4tcl)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y tcl-dev tcl
      - name: build and test
        run: |
          mkdir build && cd build
          CC=g++ ../tcl/configure
          make -j4
          make test 2>&1 | tee test.log
          grep -q "Failed	0" test.log

  python:
    name: python 2 binding (Mk4py)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      # (Python 2 is not available from setup-python any more: built from source)
      - name: cache Python 2.7
        id: py27cache
        uses: actions/cache@v4
        with:
          path: ~/py27
          key: python-2.7.18-${{ runner.os }}-${{ runner.arch }}-v1
      - name: build Python 2.7
        if: steps.py27cache.outputs.cache-hit != 'true'
        run: |
          curl -sSfL -o /tmp/py27.tgz https://www.python.org/ftp/python/2.7.18/Python-2.7.18.tgz
          tar -C /tmp -xzf /tmp/py27.tgz
          cd /tmp/Python-2.7.18
          ./configure --prefix=$HOME/py27 > /dev/null
          make -j4 > /dev/null
          make install > /dev/null
      - name: build the binding and test
        run: python/test/ci.sh $HOME/py27/bin/python
