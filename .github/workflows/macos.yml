# Builds and tests Metakit on macOS (Apple Silicon and Intel).
#
# This is started by hand (Actions > macos > Run workflow), and not on every
# push like ci.yml: when this was written, no macOS runner was ever assigned to
# the repository (the jobs stayed queued for over 20 minutes, for every image),
# which would leave every run of ci.yml waiting.  It has not been run yet, so
# whatever it finds the first time is news.
name: macos

on:
  workflow_dispatch:

jobs:
  macos:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "macos arm64", os: macos-latest, large: "5 512 --expect-all" }
          - { name: "macos x64", os: macos-15-intel, large: "" }
    env:
      LD_LIBRARY_PATH: .
      DYLD_LIBRARY_PATH: .
    steps:
      - uses: actions/checkout@v4
      - name: configure and build
        run: |
          mkdir build && cd build
          ../unix/configure
          make -j4 libmk4.so regress twide tfuzz tcorrupt tlarge mkinfo ||
            make -j4 regress twide tfuzz tcorrupt tlarge mkinfo
      - name: tests
        working-directory: build
        run: make test
      - name: datafile of over 4 Gb
        if: matrix.large != ''
        working-directory: build
        run: |
          df -h .
          ./tlarge tlarge.mk ${{ matrix.large }}
          rm -f tlarge.mk tlarge_ints.mk
